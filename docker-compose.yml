# Runs the proxy in Docker on the same computer as the official Carvera
# Controller.
#
# A container behind Docker's NAT cannot receive the machine's LAN UDP
# broadcasts. Either pin CNC_MACHINE to the machine's ip:port, or run
# cmd/discoverybeacon natively on the host and set CNC_MACHINE to the beacon's
# bridge address (for Docker Desktop, usually host.docker.internal:12222).
# In-container advertising still works by unicasting the discovery record to the
# host (host.docker.internal), where a controller on this same computer listens
# on UDP 3333; the record points that local controller at 127.0.0.1:2222, which
# is the published relay port. To advertise to other LAN controllers from Docker
# Desktop, run cmd/discoverybeacon natively on the host. CNC_NAME is required
# for advertising in Docker (without LAN broadcasts the proxy never learns the
# real machine's name to derive one from) -- and it is also how you rename the
# machine. API/WebDAV are published on host loopback only and protected with
# CNC_AUTH_TOKEN.
services:
  cnc-proxy:
    build: .
    image: cnc-proxy
    container_name: cnc-proxy
    restart: unless-stopped
    ports:
      - "2222:2222"   # relay: the controller connects here
      - "127.0.0.1:8420:8420"   # HTTP API + web UI
      - "127.0.0.1:8421:8421"   # WebDAV (mount http://127.0.0.1:8421/)
    environment:
      CNC_MACHINE: "${CNC_MACHINE:?set CNC_MACHINE to the machine's ip:port or discoverybeacon bridge, e.g. 192.168.1.42:2222 or host.docker.internal:12222}"
      CNC_NAME: "${CNC_NAME:-Carvera (proxy)}"
      CNC_AUTH_TOKEN: "${CNC_AUTH_TOKEN:?set CNC_AUTH_TOKEN to protect API and WebDAV}"
      CNC_ADVERTISE: "${CNC_ADVERTISE:-true}"
      CNC_PROXY_IP: "127.0.0.1"
      CNC_BROADCAST: "host.docker.internal"
      CNC_API_ADDR: "0.0.0.0:8420"
      CNC_DAV_ADDR: "0.0.0.0:8421"
    volumes:
      - cnc-data:/data

volumes:
  cnc-data:
